# push โค้ดใน src/ ขึ้น Google Apps Script อัตโนมัติเมื่อ push เข้า main (หรือกด Run workflow เอง)
# ตั้งค่าครั้งเดียว ดู docs/DEPLOY.md
#   Secret   CLASPRC_JSON      = เนื้อหาไฟล์ ~/.clasprc.json หลัง `npx @google/clasp@2.4.2 login`
#   Variable GAS_SCRIPT_ID     = Script ID (Project Settings → IDs)
#   Variable GAS_DEPLOYMENT_ID = Deployment ID ของ Web app (ไม่บังคับ: ถ้าใส่ จะ Deploy New version ให้ด้วย URL เดิม)
name: Deploy to Apps Script

on:
  push:
    branches: [main]
    paths: ['src/**', '.github/workflows/deploy-gas.yml']
  workflow_dispatch:

concurrency:
  group: deploy-gas
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SCRIPT_ID: ${{ vars.GAS_SCRIPT_ID }}
      DEPLOYMENT_ID: ${{ vars.GAS_DEPLOYMENT_ID }}
      HAS_CRED: ${{ secrets.CLASPRC_JSON != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Test scoring and server rules
        run: node tests/scoring.test.js && node tests/server.test.js

      - name: Check settings
        id: cfg
        run: |
          if [ -z "$SCRIPT_ID" ] || [ "$HAS_CRED" != "true" ]; then
            echo "::warning::ยังไม่ได้ตั้ง GAS_SCRIPT_ID หรือ CLASPRC_JSON — ข้ามการ deploy (ดู docs/DEPLOY.md)"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install clasp
        if: steps.cfg.outputs.ready == 'true'
        run: npm install -g @google/clasp@2.4.2

      - name: Write clasp credentials
        if: steps.cfg.outputs.ready == 'true'
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          printf '%s' "$CLASPRC_JSON" > ~/.clasprc.json
          chmod 600 ~/.clasprc.json
          printf '{"scriptId":"%s","rootDir":"src"}\n' "$SCRIPT_ID" > .clasp.json

      - name: Push files (src/ → Apps Script)
        if: steps.cfg.outputs.ready == 'true'
        run: clasp push --force

      - name: Deploy New version (same Web app URL)
        if: steps.cfg.outputs.ready == 'true' && env.DEPLOYMENT_ID != ''
        run: |
          MSG="$(git log -1 --pretty=%s | cut -c1-90) (${GITHUB_SHA::7})"
          clasp deploy --deploymentId "$DEPLOYMENT_ID" --description "$MSG"

      - name: Remove credentials
        if: always()
        run: rm -f ~/.clasprc.json .clasp.json
