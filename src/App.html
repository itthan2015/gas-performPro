<script>
window.ppStep && window.ppStep('ขั้นที่ 4/4 · เริ่มระบบ');
(function () {
  const ROLES = { eval:'ผู้ประเมิน (หัวหน้าแผนก)', div:'ผู้อนุมัติระดับฝ่าย', exec:'ผู้บริหาร', hr:'ฝ่ายบุคคล (HR Admin)', admin:'ผู้ดูแลระบบ (Admin)', emp:'พนักงาน' };
  const STAFF_ROLES = ['eval','div','exec','hr','admin'];
  const ROLE_COLORS = { emp:['#f3f2f8','#3f3b55'], eval:['#eef4ff','#1d4ed8'], div:['#fff4ec','#9a3412'], exec:['#ecfdf5','#047857'], hr:['#f1edfd','#422aa0'], admin:['#1f1650','#ffffff'] };
  const NAV = {
    eval: [['list','พนักงานในความรับผิดชอบ'],['report','รายงานสรุปผล']],
    div:  [['dash','แดชบอร์ด'],['approve','รายการรออนุมัติ'],['list','พนักงาน'],['report','รายงานสรุปผล']],
    exec: [['dash','แดชบอร์ด'],['approve','รายการรออนุมัติ'],['list','พนักงาน'],['report','รายงานสรุปผล']],
    hr:   [['dash','แดชบอร์ด'],['approve','รอบันทึกคะแนน'],['list','พนักงาน'],['report','รายงานสรุปผล'],['weights','แบบฟอร์มประเมิน'],['staff','จัดการพนักงาน']],
    emp:  [['mine','ผลประเมินของฉัน']]
  };
  NAV.admin = [['dash','แดชบอร์ด'],['approve','รายการรออนุมัติ'],['list','พนักงาน'],['report','รายงานสรุปผล'],['weights','แบบฟอร์มประเมิน'],['staff','จัดการพนักงาน']];
  NAV.hr.push(['cycles', 'รอบการประเมิน']); NAV.admin.push(['cycles', 'รอบการประเมิน']);
  const APPROVE_LABEL = { div:'อนุมัติระดับฝ่าย', exec:'อนุมัติระดับบริหาร', ack:'รับทราบผล', hr:'บันทึกคะแนน' };
  if (typeof SCORING === 'undefined') { window.ppFail && window.ppFail('ไม่พบไฟล์ ScoringClient กรุณาตรวจสอบว่าสร้างไฟล์ HTML ชื่อ ScoringClient แล้ว'); return; }
  const ST = SCORING.STATUS;
  const S = { token: null, login: { tab:'emp', code:'', challenge:null, err:'' }, boot:null, view:null, list:[], sel:null, f:{ q:'', st:'all', depts:[], act:'on' }, guide:false, errors:[], wDraft:null, adm:null, mg:{ tab:'emp', q:'', role:'all', act:'on', depts:[], d:null, err:'', newDiv:'', unitNew:{} }, prevOpen:null };
  try { S.token = sessionStorage.getItem('pp_token'); } catch (e) {}

  const $ = s => document.querySelector(s);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
  const fmt = n => (Math.round((Number(n) || 0) * 100) / 100).toString();
  const C4 = '';
  const tag = st => { const x = ST[st] || [st ? String(st) : 'ยังไม่ประเมิน', 'tag-neutral']; return `<span class="tag ${x[1]}">${esc(x[0])}</span>`; };
  const isSent = st => ['div','exec','ack','hr','done'].includes(st);
  // รูปแบบวันที่ทั้งระบบ: dd/MM/yyyy (ปี พ.ศ.) — เปลี่ยน DATE_BE เป็น false ถ้าต้องการ ค.ศ.
  const DATE_BE = true;
  const p2 = n => String(n).padStart(2, '0');
  function fmtD(v, empty) {
    if (!v) return empty == null ? '-' : empty;
    const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(v));
    if (m) return m[3] + '/' + m[2] + '/' + (Number(m[1]) + (DATE_BE ? 543 : 0));
    const d = new Date(v); if (isNaN(d)) return String(v);
    return p2(d.getDate()) + '/' + p2(d.getMonth() + 1) + '/' + (d.getFullYear() + (DATE_BE ? 543 : 0));
  }
  // dd/MM/yyyy → YYYY-MM-DD (รับปี พ.ศ. หรือ ค.ศ.) · ไม่ถูกต้อง = null
  function parseD(s) {
    s = String(s || '').trim(); if (!s) return '';
    const m = /^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})$/.exec(s); if (!m) return null;
    let y = Number(m[3]); if (y > 2400) y -= 543;
    const iso = y + '-' + p2(m[2]) + '-' + p2(m[1]), d = new Date(iso + 'T00:00:00');
    return !isNaN(d) && d.getDate() === Number(m[1]) && d.getMonth() + 1 === Number(m[2]) ? iso : null;
  }
  const dateIn = (attr, iso) => `<input class="input" inputmode="numeric" maxlength="10" placeholder="dd/MM/yyyy" value="${esc(/^\d{4}-\d{2}-\d{2}$/.test(iso || '') ? fmtD(iso) : iso || '')}" data-date="1" ${attr}>`;
  const thDate = iso => fmtD(iso, '...../...../.....');
  const tenure = iso => { if (!iso) return '–'; const s = new Date(iso), n = new Date(); let y = n.getFullYear()-s.getFullYear(), m = n.getMonth()-s.getMonth(); if (n.getDate() < s.getDate()) m--; if (m < 0) { y--; m += 12; } return y + ' ปี ' + m + ' เดือน'; };
  const me = () => S.boot.me;
  const W = form => null; // ไม่ใช้น้ำหนักแล้ว (คะแนนตามแบบฟอร์ม rev.10.11.69)
  const FN = f => formOf(f), FSHORT = f => FN(f).short, FNAME = f => f === 'new' ? 'แบบฟอร์มเดิม · ระดับ 1–3' : f === 'sup' ? 'แบบฟอร์มเดิม · ระดับ 4–5' : 'แบบประเมิน' + FN(f).name + ' (' + FN(f).short + ')';

  function raw(fn, ...args) {
    return new Promise((res, rej) => google.script.run.withSuccessHandler(res).withFailureHandler(e => rej(e))[fn](...args));
  }
  async function api(fn, ...args) {
    try { return await raw(fn, S.token, ...args); }
    catch (e) { if (String((e && e.message) || e).includes('SESSION_EXPIRED')) { signOut('หมดเวลาการใช้งาน กรุณาเข้าสู่ระบบอีกครั้ง'); } throw e; }
  }
  function setToken(t) { S.token = t; try { t ? sessionStorage.setItem('pp_token', t) : sessionStorage.removeItem('pp_token'); } catch (e) {} }
  function signOut(msg) {
    if (S.token) raw('apiLogout', S.token).catch(() => {});
    setToken(null);
    Object.assign(S, { boot:null, view:null, list:[], sel:null, adm:null, f:{ q:'', st:'all', depts:[] }, wDraft:null, login:{ tab:'emp', code:'', challenge:null, err: msg || '' } });
    loginView();
  }
  let busyN = 0, toastT;
  function busy(on) { busyN += on ? 1 : -1; $('#busy').hidden = busyN <= 0; }
  // dialog แจ้ง "ระบบกำลังทำงาน" ระหว่างเปลี่ยนหน้า / โหลดข้อมูล (แสดงหลัง 150ms กันกระพริบเมื่อโหลดเร็ว)
  const PAGE_TH = { dash:'แดชบอร์ด', list:'รายชื่อพนักงาน', eval:'แบบประเมิน', approve:'รายการรออนุมัติ', report:'รายงานสรุปผล', mine:'ผลประเมินของฉัน', weights:'แบบฟอร์มประเมิน', staff:'จัดการพนักงาน', att:'สถิติมาทำงาน', cycles:'รอบการประเมิน', help:'คู่มือการใช้งาน' };
  let loadN = 0, loadT;
  function loading(on, msg) {
    const el = $('#loadDlg'); if (!el) return;
    if (on && msg && loadN === 0) $('#loadMsg').textContent = msg;
    loadN = Math.max(0, loadN + (on ? 1 : -1));
    if (on) { if (loadN === 1) { clearTimeout(loadT); loadT = setTimeout(() => { if (loadN > 0) el.hidden = false; }, 150); } }
    else if (!loadN) { clearTimeout(loadT); el.hidden = true; }
  }
  async function withLoading(msg, fn) { loading(true, msg); try { return await fn(); } finally { loading(false); } }
  function toast(msg, err) { const t = $('#toast'); t.textContent = msg; t.className = 'toast' + (err ? ' err' : ''); t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, err ? 5000 : 2600); }
  async function run(promise, ok, msg) { busy(true); loading(true, msg || (ok ? 'กำลังบันทึกข้อมูล กรุณารอสักครู่…' : 'กำลังโหลดข้อมูล กรุณารอสักครู่…')); try { const r = await promise; if (ok) toast(ok); return r; } catch (e) { const m = (e && e.message) || String(e); if (!m.includes('SESSION_EXPIRED')) toast(m, true); throw e; } finally { busy(false); loading(false); } }

  // ───────── shell ─────────
  async function init() {
    if (typeof SCORING === 'undefined') return window.ppFail('ไม่พบไฟล์ ScoringClient กรุณาตรวจสอบว่าสร้างไฟล์ HTML ชื่อ ScoringClient แล้ว');
    if (typeof google === 'undefined' || !google.script) return window.ppFail('ต้องเปิดผ่าน URL ของ Web app ที่ deploy แล้วเท่านั้น');
    if (!S.token) return loginView();
    window.ppStep && window.ppStep('กำลังตรวจสอบการเข้าสู่ระบบเดิม…');
    const ok = await Promise.race([raw('apiPing').then(() => true, () => false), new Promise(r => setTimeout(() => r(false), 12000))]);
    if (!ok) { setToken(null); return loginView(); }
    try {
      S.boot = await api('apiBootstrap');
      S.view = home();
      shell();
      await go(S.view);
    } catch (e) {
      const m = (e && e.message) || String(e);
      if (m.includes('SESSION_EXPIRED')) return;
      $('#app').innerHTML = `<div class="fatal card">${C4}<span class="kicker">PerformPro</span><h3>เข้าใช้งานไม่ได้</h3><p class="muted">${esc(m)}</p><button class="btn btn-primary" id="toLogin">กลับไปหน้าเข้าสู่ระบบ</button></div>`;
      $('#toLogin').onclick = () => signOut();
    }
  }

  // ───────── login ─────────
  function loginView() {
    const L = S.login, ch = L.challenge, emp = L.tab === 'emp';
    $('#app').innerHTML = `
      <div class="login">
        <section class="login-hero">
          <span class="blob b1"></span><span class="blob b2"></span>
          <div class="logo-row"><span class="logo">P</span><div><b>PERFORMPRO</b><span>ฝ่ายทรัพยากรบุคคล</span></div></div>
          <div class="hero-copy"><h1>ระบบประเมินผลการปฏิบัติงาน</h1><p>ประเมิน อนุมัติ และติดตามผลการประเมินประจำปีในที่เดียว แต่ละหน่วยงานเห็นเฉพาะข้อมูลของตนเอง</p></div>
          <span class="hero-foot">PerformPro</span>
        </section>
        <section class="login-side">
          <form class="login-card" id="loginForm" autocomplete="off">
            <div><h2>เข้าสู่ระบบ</h2><span class="muted">เลือกประเภทผู้ใช้งาน</span></div>
            <div class="tabs"><button type="button" data-tab="emp" ${emp ? 'aria-selected="true"' : ''}>พนักงาน</button><button type="button" data-tab="staff" ${!emp ? 'aria-selected="true"' : ''}>หัวหน้า / HR</button></div>
            ${emp && ch ? `
              <div class="who-box"><span>${esc(ch.code)}</span><b>คุณ${esc(ch.name)}</b></div>
              <div class="field"><label>${esc(ch.question)}</label><input class="input lg" id="ans" inputmode="numeric" placeholder="${esc(ch.placeholder)}" autofocus></div>
              <button class="btn btn-primary btn-xl" type="submit">ยืนยันตัวตน</button>
              <button class="btn btn-ghost" type="button" id="changeCode" style="align-self:center">เปลี่ยนรหัสพนักงาน</button>` : `
              <div class="field"><label>รหัสพนักงาน</label><input class="input lg" id="code" inputmode="numeric" placeholder="เช่น 38031" value="${esc(L.code)}" autofocus></div>
              ${emp ? '<span class="small muted">ระบบจะสุ่มถามข้อมูลส่วนตัว 1 ข้อเพื่อยืนยันตัวตน</span>' : '<div class="field"><label>รหัสผ่าน</label><input class="input lg" id="pwd" type="password" placeholder="••••••"></div>'}
              <button class="btn btn-primary btn-xl" type="submit">${emp ? 'ถัดไป' : 'เข้าสู่ระบบ'}</button>`}
            ${L.err ? `<div class="alert">${esc(L.err)}</div>` : ''}
            <span class="small muted">ตอบผิดได้ 3 ครั้ง หลังจากนั้นบัญชีจะถูกล็อกจนกว่าฝ่ายบุคคลจะปลดล็อก</span>
          </form>
        </section>
      </div>`;
    document.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { S.login = { tab: b.dataset.tab, code: S.login.code, challenge: null, err: '' }; loginView(); });
    const cc = $('#changeCode'); if (cc) cc.onclick = () => { S.login.challenge = null; S.login.err = ''; loginView(); };
    $('#loginForm').onsubmit = async ev => {
      ev.preventDefault();
      const L = S.login;
      if (loadN > 0) return;
      const btn = ev.target.querySelector('[type="submit"]'); if (btn) btn.disabled = true;
      busy(true);
      loading(true, L.tab === 'emp' && !L.challenge ? 'กำลังตรวจสอบรหัสพนักงาน กรุณารอสักครู่…' : 'กำลังเข้าสู่ระบบ กรุณารอสักครู่…');
      try {
        if (L.tab === 'emp' && !L.challenge) { L.code = $('#code').value.trim(); L.challenge = await raw('apiLoginStart', L.code); L.err = ''; }
        else if (L.tab === 'emp') { const r = await raw('apiLoginAnswer', L.challenge.challengeId, $('#ans').value); return enter(r.token); }
        else { L.code = $('#code').value.trim(); const r = await raw('apiStaffLogin', L.code, $('#pwd').value); return enter(r.token); }
      } catch (e) {
        L.err = (e && e.message) || String(e);
        if (L.err.includes('STAFF_ACCOUNT:')) { L.err = L.err.split('STAFF_ACCOUNT:')[1]; L.tab = 'staff'; L.challenge = null; }
        if (/ล็อก|หมดอายุ/.test(L.err)) L.challenge = null;
      } finally { busy(false); loading(false); }
      loginView();
    };
  }
  async function enter(token) { setToken(token); S.login = { tab:'emp', code:'', challenge:null, err:'' }; await withLoading('เข้าสู่ระบบสำเร็จ กำลังเตรียมข้อมูล กรุณารอสักครู่…', init); }

  function home() { const r = me().role; return r === 'eval' ? 'list' : r === 'emp' ? 'mine' : 'dash'; }
  function scopeOf(t, v) { if (t === 'all') return 'ทั้งบริษัท'; if (t === 'self') return 'เฉพาะตนเอง'; v = v || []; if (!v.length) return 'ยังไม่กำหนดหน่วยงาน'; return v.length <= 2 ? v.join(', ') : v[0] + ' และอีก ' + (v.length - 1) + ' หน่วยงาน'; }
  function scopeText() { const u = me(); return scopeOf(u.scopeType, u.scopeValues); }

  function shell() {
    const c = S.boot.cycle, u = me();
    $('#app').innerHTML = `
      <div class="shell${S.navMin ? ' nav-min' : ''}">
        <header class="top">
          <button class="hamb" data-hamb title="ย่อ/ขยายเมนู" aria-label="ย่อ/ขยายเมนู"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
          <div class="brand-wrap"><span class="eyebrow">รอบการประเมิน</span><b>${esc(c.name)}</b></div><span class="small muted">สถิติ ${thDate(c.data_from)} – ${thDate(c.data_to)}</span>
          <span class="tag tag-accent">ขอบเขต: ${esc(scopeText())}</span>
        </header>
        <nav class="side" id="nav"></nav>
        <div class="nav-scrim" data-hamb></div>
        <main class="main" id="main"></main>
      </div>`;
    $('.top').addEventListener('click', e => { if (e.target.closest('[data-hamb]')) toggleNav(); });
    $('.nav-scrim').addEventListener('click', () => toggleNav(false));
    $('#nav').addEventListener('click', e => { if (loadN > 0) return; if (e.target.closest('[data-logout]')) return signOut(); const b = e.target.closest('[data-nav]'); if (b) { if (isMobile()) toggleNav(false); go(b.dataset.nav); } });
    const m = $('#main');
    m.addEventListener('click', onClick);
    m.addEventListener('input', onInput);
    m.addEventListener('change', onChange);
  }
  // เมนูด้านซ้าย: จอกว้าง = ย่อเหลือไอคอน (จำค่าไว้) · จอเล็ก = เปิดเป็นลิ้นชักทับเนื้อหา
  const isMobile = () => window.matchMedia('(max-width:900px)').matches;
  S.navMin = (() => { try { return localStorage.getItem('pp_nav_min') === '1'; } catch (e) { return false; } })();
  function toggleNav(force) {
    const sh = $('.shell'); if (!sh) return;
    if (isMobile()) { sh.classList.toggle('nav-open', force ?? !sh.classList.contains('nav-open')); return; }
    S.navMin = force === false ? false : force === true ? true : !S.navMin;
    sh.classList.toggle('nav-min', S.navMin);
    try { localStorage.setItem('pp_nav_min', S.navMin ? '1' : '0'); } catch (e) {}
  }
  const NAV_IC = { dash:'M3 13h8V3H3zM13 21h8V11h-8zM3 21h8v-6H3zM13 3v6h8V3z', approve:'M9 11l3 3 8-8M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9', list:'M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8M22 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8', mine:'M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8', report:'M3 3v18h18M7 16v-5M12 16V8M17 16v-8', forms:'M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8zM14 2v6h6M8 13h8M8 17h5', weights:'M12 3v18M5 8h14M5 8l-3 7a4 4 0 0 0 6 0zM19 8l-3 7a4 4 0 0 0 6 0z', staff:'M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8M19 8v6M22 11h-6', cycles:'M8 2v4M16 2v4M3 10h18M5 4h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z', att:'M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20M12 6v6l4 2', help:'M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20M9.1 9a3 3 0 0 1 5.8 1c0 2-3 3-3 3M12 17h.01' };
  const navIc = k => `<svg class="nav-ic" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="${NAV_IC[k] || NAV_IC.forms}"/></svg>`;
  function nav() {
    const u = me(), inbox = S.list.filter(r => r.canAct).length;
    $('#nav').innerHTML = `<div class="side-brand"><span class="logo">P</span><div><b>PERFORMPRO</b><span>ประเมินผลการปฏิบัติงาน</span></div></div>` +
      NAV[u.role].concat(S.boot.canAtt ? [['att', 'สถิติมาทำงาน']] : []).concat([['help', 'Help? คู่มือการใช้งาน']]).map(([k, l]) => {
        const cur = S.view === k || (k === 'list' && S.view === 'eval');
        return `<button class="nav-item" data-nav="${k}" title="${esc(l)}" ${cur ? 'aria-current="page"' : ''}><span class="nav-l">${navIc(k)}<span class="nav-t">${l}</span></span>${k === 'approve' && inbox ? `<span class="badge">${inbox}</span>` : ''}</button>`;
      }).join('') +
      `<div class="foot"><span class="avatar">${esc((u.name || '?').trim().charAt(0))}</span><div class="who"><b>${esc(u.name)}</b><span>${ROLES[u.role]}</span></div><button class="logout" data-logout title="ออกจากระบบ">ออก</button></div>`;
  }

  async function go(view) { return withLoading('กำลังเปิดหน้า ' + (PAGE_TH[view] || '') + ' กรุณารอสักครู่…', () => goNow(view)); }
  async function goNow(view) {
    S.view = view; S.errors = [];
    if (['dash','list','approve','report'].includes(view) || !S.list.length) S.list = await run(api('apiListEmployees'));
    if (view === 'mine') S.sel = await run(api('apiGetEvaluation', me().empCode));
    if (view === 'staff') S.adm = await run(api('apiAdminData'));
    if (view === 'cycles') { S.cy = await run(api('apiCycleList')); S.cyD = null; }
    if (view === 'att') { S.att = await run(api('apiAttList')); S.attD = {}; S.attMsg = null; }

  function render() {

  // ───────── dashboard ─────────
  const ACT_OPTS = [['on','ปกติ'],['off','ลาออก'],['all','ทั้งหมด']];
  function actOk(r, v) { const on = r.isactive !== false && r.active !== false; if (v === 'check') return r.status === 'check'; return !v || v === 'all' || (v === 'on') === on; }
  function actSeg(key, cur, list) { return `<div class="seg" title="สถานะพนักงาน (isactive)">${ACT_OPTS.map(([v, l]) => `<label><input type="radio" name="act-${key}" value="${v}" data-act-f="${key}" ${cur === v ? 'checked' : ''}>${l}${list ? ` <span style="opacity:.7">${list.filter(r => actOk(r, v)).length}</span>` : ''}</label>`).join('')}</div>`; }

  // ตัวเลือกหน่วยงานแบบช่องติ๊ก แยกกลุ่มตามฝ่าย → แผนก (ติ๊กชื่อฝ่าย = เลือกทุกแผนกในฝ่าย)

  function vDash() {

  // ───────── evaluation ─────────
  function chainOf(sel) {

    const showDiv = hasDiv || (!skip && !(idx >= 2 && !hasDiv));

  const STEP_ROLE = { submit:'ผู้ประเมิน (หัวหน้าแผนก)', div:'ผู้อนุมัติระดับฝ่าย', exec:'ผู้บริหาร', ack:'พนักงาน', hr:'ฝ่ายบุคคล (HR Admin)' };
  const fmtDT = v => { if (!v) return ''; const d = new Date(v); return isNaN(d) ? fmtD(v) : fmtD(v) + ' ' + p2(d.getHours()) + ':' + p2(d.getMinutes()) + ' น.'; };
  function timelineHTML(sel) {

  // ───────── ประวัติ + เอกสารแนบ ─────────

  function prevHTML(sel) {

      ${P.map((p, i) => { const o = P[i + 1], d = o ? p.total - o.total : null, open = S.prevOpen === sel.emp.code + ':' + i;
        const tr = d == null ? 'รอบแรกในระบบ' : d > 0 ? '▲ ' + fmt(d) + ' จากรอบก่อน' : d < 0 ? '▼ ' + fmt(-d) + ' จากรอบก่อน' : 'เท่ากับรอบก่อน';

          ${open ? `<div class="prev-body">
            ${p.parts.length ? `<table class="table" style="font-size:13px"><tbody>${p.parts.map(x => `<tr><td>P${x.no} · ${esc(x.short)}</td><td class="right nowrap">${fmt(x.w)} / ${x.weight}</td></tr>`).join('')}</tbody></table>` : '<span class="small muted">ไม่มีรายละเอียดรายข้อ (นำเข้าจากระบบเดิม)</span>'}
            ${p.strengths.length ? `<div class="small"><span class="muted">จุดเด่น: </span>${esc(p.strengths.join(' · '))}</div>` : ''}

  function filesHTML(sel) {

      <div class="files">${F.map(f => { const img = /^image\//.test(f.mime), ext = (f.name.split('.').pop() || 'FILE').toUpperCase().slice(0, 4), col = ext === 'PDF' ? '#c2410c' : /XLS|CSV/.test(ext) ? '#047857' : /DOC/.test(ext) ? '#1d4ed8' : '#5636c9';
        return `<div class="file"><a href="${esc(f.url)}" target="_blank" rel="noopener" class="thumb">${img && f.url ? `<img src="${esc(f.url)}" alt="${esc(f.name)}">` : `<span style="color:${col}">${esc(ext)}</span>`}</a>
          <div class="meta"><span class="fname" title="${esc(f.name)}">${esc(f.name)}</span><span class="small muted">${sizeTxt(f.size)} · ${thDate(f.at)} · ${esc(f.by || '')}</span>

  function profileHTML(sel) { return `<div class="grid-2 noprint" style="align-items:start">${prevHTML(sel)}${filesHTML(sel)}</div>`; }
  function readB64(file) { return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(',')[1] || ''); r.onerror = rej; r.readAsDataURL(file); }); }
  async function upload(code, list, input) {
    const files = Array.from(list || []); if (input) input.value = '';
    const big = files.filter(f => f.size > 10 * 1048576), ok = files.filter(f => f.size <= 10 * 1048576);
    if (big.length) toast('ข้ามไฟล์ที่เกิน 10 MB: ' + big.map(f => f.name).join(', '), true);
    let latest = null;
    for (const f of ok) { const b64 = await readB64(f); latest = await run(api('apiUploadFile', code, { name: f.name, mime: f.type, size: f.size, base64: b64 })); }
    if (!latest) return;
    toast('อัปโหลด ' + ok.length + ' ไฟล์แล้ว');
    if (S.sel && S.sel.emp.code === code) S.sel.files = latest;
    if (S.mg.files && S.mg.files.emp.code === code) S.mg.files.files = latest;
    rerender();

  }
  const ATT_HEAD = ['รหัสพนักงาน', 'ชื่อ-นามสกุล', 'แผนก', 'มาสาย (นาที)', 'ลาป่วย (วัน)', 'ลากิจ (วัน)', 'ขาดงาน (วัน)', 'หนังสือเตือนวาจา (ครั้ง)', 'หนังสือเตือนลายลักษณ์อักษร (ฉบับ)'];
  const ATT_ALIAS = { late: /สาย|late/i, sick: /ป่วย|sick/i, personal: /กิจ|personal/i, absent: /ขาด|absent/i, verbal: /วาจา|verbal/i, written: /ลายลักษณ์|written/i, code: /รหัส|code|prs/i };
  function csvParse(text) {
    const out = []; let row = [], f = '', q = false;
    text = text.replace(/^\uFEFF/, '');
    for (let i = 0; i < text.length; i++) {
      const ch = text[i];
      if (q) { if (ch === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += ch; continue; }
      if (ch === '"') q = true; else if (ch === ',' || ch === '\t') { row.push(f); f = ''; } else if (ch === '\n') { row.push(f); out.push(row); row = []; f = ''; } else if (ch !== '\r') f += ch;
    }
    if (f !== '' || row.length) { row.push(f); out.push(row); }
    return out.filter(r => r.some(x => String(x).trim() !== ''));
  }
  function attTemplate() {
    const cell = v => { v = String(v ?? ''); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
    const lines = [ATT_HEAD].concat(S.att.rows.filter(r => r.isactive).map(r => [r.code, r.name, r.dept].concat(ATT_K.map(k => r.att[k] || 0))));
    const blob = new Blob(['\uFEFF' + lines.map(l => l.map(cell).join(',')).join('\r\n')], { type: 'text/csv;charset=utf-8' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'PFormPro_สถิติมาทำงาน_' + (S.att.cycle.year_be || '') + '_' + (S.att.cycle.round || '') + '.csv'; document.body.appendChild(a); a.click(); a.remove();
  }
  function attImport(text) {
    const rows = csvParse(text); if (rows.length < 2) { S.attMsg = { ok: 'ไม่พบข้อมูลในไฟล์', bad: [] }; return rerender(); }
    const head = rows[0].map(x => String(x).trim()), col = {};
    Object.keys(ATT_ALIAS).forEach(k => { const i = head.findIndex(x => ATT_ALIAS[k].test(x)); if (i >= 0) col[k] = i; });
    if (col.code == null) { S.attMsg = { ok: 'ไม่พบคอลัมน์ "รหัสพนักงาน" ในแถวแรกของไฟล์', bad: [] }; return rerender(); }
    const bad = []; let n = 0;
    rows.slice(1).forEach((r, i) => {
      const code = String(r[col.code] || '').trim(), e = S.att.rows.find(x => x.code === code);
      if (!e) return bad.push('แถว ' + (i + 2) + ' ไม่พบรหัส ' + (code || '(ว่าง)'));
      const d = {}; let err = '';
      ATT_K.forEach(k => { if (col[k] == null) return; const raw = String(r[col[k]] ?? '').trim(); if (raw === '') return; const v = Number(raw.replace(/,/g, '')); if (!(v >= 0)) err = k; else if (v !== Number(e.att[k] || 0)) d[k] = v; });
      if (err) return bad.push('แถว ' + (i + 2) + ' รหัส ' + code + ' ค่าไม่ถูกต้อง');
      if (Object.keys(d).length) { S.attD[code] = Object.assign(S.attD[code] || {}, d); n++; }
    });
    S.attMsg = { ok: 'อ่านไฟล์ ' + (rows.length - 1) + ' แถว · มีค่าเปลี่ยน ' + n + ' คน', bad };
    rerender();
  }

    if (c === 'st') { S.f.st = t.value; return render(); }
    if (c === 'report') return openReport(t.value);
    if (c === 'rpcycle') { S.rp = await run(api('apiReportList', Number(t.value))); S.sel = null; S.rpHist = null; S.f.depts = S.f.depts.filter(x => S.rp.rows.some(r => r.dept === x)); return render(); }
    if (t.dataset.num) return mutate(sc => { sc[t.dataset.num] = Math.max(0, parseInt(t.value) || 0); }, true);
    if (t.dataset.upload) return upload(t.dataset.upload, t.files, t);
    if (t.dataset.movedept) { S.adm = await run(api('apiMoveDepartment', t.dataset.movedept, t.value), 'ย้าย ' + t.dataset.movedept + ' ไป' + t.value + 'แล้ว'); return rerender(); }
    if (t.dataset.mgtab) { S.mg.tab = t.dataset.mgtab; return rerender(); }
    if (t.dataset.empfile) { const f = t.files[0]; t.value = ''; if (!f) return; const rd = new FileReader(); rd.onload = () => empImport(String(rd.result)); rd.readAsText(f, 'utf-8'); return; }
    if (t.dataset.attfile) { const f = t.files[0]; t.value = ''; if (!f) return; const rd = new FileReader(); rd.onload = () => attImport(String(rd.result)); rd.readAsText(f, 'utf-8'); return; }
    if (c === 'mgrole') { S.mg.role = t.value; return rerender(); }
    if (t.dataset.helptab) { S.helpTab = t.dataset.helptab; return render(); }
    if (t.dataset.empview) { const on = t.dataset.empview === 'on'; const r = await run(api('apiSetEmpView', on), on ? 'เปิดให้พนักงานดูผลประเมินแล้ว' : 'ปิดการดูผลประเมินของพนักงานแล้ว'); S.boot.empView = r.empView; S.boot.empViewBy = r.by; return rerender(); }
    if (t.dataset.actF) { if (t.dataset.actF === 'mg') S.mg.act = t.value; else S.f.act = t.value; return rerender(); }
    if (t.dataset.mgactive) { S.mg.d.active = t.dataset.mgactive === 'true'; if (!S.mg.d.active) S.mg.d.evaluate = false; /* ลาออก → ค่าเริ่มต้นไม่รับประเมิน */ return rerender(); }
    if (t.dataset.mgscope) { S.mg.d.scopeType = t.dataset.mgscope; S.mg.d.scopeValues = []; return rerender(); }
    if (t.dataset.mg) { const k = t.dataset.mg; S.mg.d[k] = t.type === 'checkbox' ? t.checked : t.value; if (k === 'role' && t.value !== 'emp' && !['dept','div','all'].includes(S.mg.d.scopeType)) S.mg.d.scopeType = 'dept'; if (['role','active','evaluate'].includes(k)) return rerender(); return; }
  }

  init();
})();
</script>
